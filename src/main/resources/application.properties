spring.application.name=demo

# Perfil por defecto cuando no se especifica ninguno (ej. levantar la app localmente).
# Los tests fuerzan el perfil "test" explicitamente via @ActiveProfiles y no dependen de esto.
spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=update

# Hibernate crea el esquema antes de correr data.sql (necesario para el seed de
# TipoArticulo/TipoMovimiento del modulo Produccion, ver ADR 0001 seccion 8).
spring.jpa.defer-datasource-initialization=true
