# Perfil "dev": MySQL como base de datos de desarrollo.
#
# COMPLETAR ANTES DE USAR: reemplazar host/puerto/nombre de base, usuario y password
# por las credenciales reales de tu MySQL local. Este archivo es el UNICO que hay
# que editar para conectar contra MySQL.
spring.datasource.url=jdbc:mysql://localhost:3306/AlacanDB?useSSL=false&serverTimezone=UTC
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=passw0rd

# data.sql solo corre automaticamente para datasources "embedded" (H2). MySQL no lo es,
# asi que hay que pedirlo explicitamente para que el seed de TipoArticulo/TipoMovimiento
# (ADR 0001, seccion 8) tambien cargue en dev.
spring.sql.init.mode=always
